<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atom Drug Guard - Operator Console</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d3748;
            padding-bottom: 10px;
        }
        .status {
            display: flex;
            gap: 15px;
        }
        .status span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .on { background-color: #4caf50; }
        .off { background-color: #f44336; }
        .main-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .panel {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
        }
        .btn {
            background-color: #008cba;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-scan {
            background-color: #ff5722;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            margin-top: 20px;
        }
        .btn-stop {
            background-color: #3b82f6;
        }
        .sensor-values {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .sensor-card {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        .sensor-card.red { border-left: 5px solid #ef4444; }
        .sensor-card.blue { border-left: 5px solid #3b82f6; }
        .log-container {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            color: #38bdf8;
            border: 1px solid #1e293b;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
        }
        .flex-buttons {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Atom Drug Guard</h2>
        <div class="status">
            <span><div id="serial-status" class="indicator off"></div> Serial: Connected</span>
            <span><div id="server-status" class="indicator off"></div> Server: Off</span>
            <span>Audience: 0</span>
        </div>
    </div>

    <div class="main-container">
        <div class="panel">
            <h3>System Control</h3>
            <div class="input-group">
                <label>Relay Server URL:</label>
                <input type="text" id="server-url" value="https://atom-backend.onrender.com">
            </div>
            <div class="flex-buttons">
                <button class="btn" id="connect-esp">Connect ESP32</button>
                <button class="btn" id="connect-server">Connect to Server</button>
            </div>
            
            <button class="btn btn-scan" id="start-scan">Initiate Drug Scan</button>
            <button class="btn btn-stop" id="stop-scan" style="margin-top:10px; width:100%;">Stop</button>
        </div>

        <div class="panel">
            <h3>Live Sensor Values</h3>
            <div class="sensor-values">
                <div class="sensor-card red">
                    <p style="color:#ef4444; margin:0;">RED</p>
                    <h2 id="val-r" style="margin:10px 0 0 0;">-</h2>
                </div>
                <div class="sensor-card blue">
                    <p style="color:#3b82f6; margin:0;">BLUE</p>
                    <h2 id="val-b" style="margin:10px 0 0 0;">-</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="log-container" id="log-box">
        [SYSTEM] Ready. Awaiting operations...
    </div>

    <script>
        let socket = null;
        let port = null;
        let reader = null;
        const logBox = document.getElementById('log-box');

        function printLog(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div>[${time}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Connect to Render Pipeline
        document.getElementById('connect-server').addEventListener('click', () => {
            let targetUrl = document.getElementById('server-url').value.trim();
            if(targetUrl.startsWith('http')) {
                targetUrl = targetUrl.replace(/^http/, 'ws');
            }

            printLog(`Attempting connection to handshake relay...`);
            
            if (typeof io === 'undefined') {
                printLog("ERROR: Socket library asset missing.");
                return;
            }

            socket = io(targetUrl, { transports: ['websocket'] });

            socket.on('connect', () => {
                document.getElementById('server-status').className = "indicator on";
                printLog("Connected to live audience relay network.");
            });

            socket.on('disconnect', () => {
                document.getElementById('server-status').className = "indicator off";
                printLog("Disconnected from server resource.");
            });

            socket.on('connect_error', (err) => {
                printLog(`Server connection error: websocket error`);
            });
        });

        // Web Serial Port Connection
        document.getElementById('connect-esp').addEventListener('click', async () => {
            if ('serial' in navigator) {
                try {
                    port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 115200 });
                    document.getElementById('serial-status').className = "indicator on";
                    printLog("ESP32 interface bound successfully.");
                    readSerial();
                } catch (e) {
                    printLog(`Serial Error: ${e.message}`);
                }
            } else {
                alert("Browser engine does not support Web Serial.");
            }
        });

        async function readSerial() {
            while (port.readable) {
                const decoder = new TextDecoderStream();
                const closed = port.readable.pipeTo(decoder.writable);
                reader = decoder.readable.getReader();
                try {
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        if (value) {
                            parseIncomingStream(value);
                        }
                    }
                } catch (e) {
                    printLog(`Stream break: ${e.message}`);
                } finally {
                    reader.releaseLock();
                }
            }
        }

        function parseIncomingStream(data) {
            printLog(`Data: ${data.trim()}`);
            const rMatch = data.match(/R:(\d+)/);
            const bMatch = data.match(/B:(\d+)/);
            if(rMatch) {
                document.getElementById('val-r').innerText = rMatch[1];
                if(socket) socket.emit('telemetry', {type:'R', value:rMatch[1]});
            }
            if(bMatch) {
                document.getElementById('val-b').innerText = bMatch[1];
                if(socket) socket.emit('telemetry', {type:'B', value:bMatch[1]});
            }
        }

        document.getElementById('start-scan').addEventListener('click', () => {
            printLog("Initiating scan sequence...");
            if(socket && socket.connected) {
                socket.emit('command', { action: 'START_SCAN' });
            }
        });

        document.getElementById('stop-scan').addEventListener('click', () => {
            printLog("Scan sequence terminated.");
            if(socket && socket.connected) {
                socket.emit('command', { action: 'STOP_SCAN' });
            }
        });
    </script>
</body>
</html>
